<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeshRescue - Mission Control</title>
    <script>
      window.addEventListener('error', function(event) {
        document.body.innerHTML = '<div style="color:red; padding:20px; font-size:24px; background:white;">Error: ' + event.message + '</div>';
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML = '<div style="color:red; padding:20px; font-size:24px; background:white;">Promise Rejection: ' + event.reason + '</div>';
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
